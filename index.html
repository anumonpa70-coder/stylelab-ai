
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StyleLab AI</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#101014;color:#f7f7fa;
  font-family:Arial,sans-serif
}
header{padding:22px 18px;border-bottom:1px solid #303039}
h1{margin:0;color:#c4a5ff;font-size:25px}
main{max-width:650px;margin:auto;padding:22px 16px}
.card{background:#1c1c24;border:1px solid #353540;
  padding:18px;border-radius:18px;margin:18px 0}
label{display:block;margin:14px 0 8px}
input,select,button{
  width:100%;padding:13px;border-radius:10px;
  margin-top:7px;font-size:16px
}
input,select{background:#292934;color:white;border:1px solid #454552}
button{background:#bda0ff;color:#17121f;
  border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
img{display:block;width:100%;max-height:440px;
  object-fit:contain;border-radius:12px;margin-top:14px}
.muted{color:#b8b8c7;line-height:1.6}
#status{white-space:pre-wrap;color:#d4c1ff}
</style>
</head>
<body>
<header><h1>StyleLab AI</h1>
<p class="muted">Your virtual outfit studio</p></header>
<main>
  <section class="card">
    <h2>Try a new outfit</h2>
    <p class="muted">Upload a photo you own or have permission to use.</p>

    <label for="photo">Choose photo</label>
    <input id="photo" type="file" accept="image/*">

    <img id="preview" alt="Your selected photo"
      hidden>

    <label for="outfit">Choose outfit style</label>
    <select id="outfit">
      <option>Casual T-shirt</option>
      <option>Formal suit</option>
      <option>Traditional outfit</option>
      <option>Summer dress</option>
    </select>

    <button id="tryBtn">Preview selection</button>
    <p id="status" role="status" aria-live="polite"></p>
  </section>

  <p class="muted">
    Demo only: this page does not generate or alter clothing.
    Your photo stays in this browser preview; no AI service
    is connected yet.
  </p>
</main>
<script>
const photo = document.getElementById("photo");
const preview = document.getElementById("preview");
const status = document.getElementById("status");
let localURL = null;

photo.addEventListener("change", () => {
  if (localURL) URL.revokeObjectURL(localURL);
  const file = photo.files[0];
  if (!file) {
    preview.hidden = true;
    return;
  }
  if (!file.type.startsWith("image/")) {
    status.textContent = "Please choose an image file.";
    photo.value = "";
    return;
  }
  if (file.size > 8 * 1024 * 1024) {
    status.textContent = "Choose an image under 8 MB.";
    photo.value = "";
    return;
  }
  localURL = URL.createObjectURL(file);
  preview.src = localURL;
  preview.hidden = false;
  status.textContent = "Photo loaded in local preview.";
});

document.getElementById("tryBtn").addEventListener("click", () => {
  if (!photo.files.length) {
    status.textContent = "Choose a photo first.";
    return;
  }
  const outfit = document.getElementById("outfit").value;
  status.textContent =
    "Selected: " + outfit +
    "\nDemo only. Connect a virtual try-on AI API to generate an image.";
});
</script>
</body>
</html>
